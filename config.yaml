ollama:
  model: gemma3:4b
  base_url: http://localhost:11434
  timeout: 900

api:
  model: deepseek/deepseek-v4-flash:free
  base_url: https://openrouter.ai/api/v1

  # model: gemini-2.0-flash                 # Google AI Studio (временно 2026-05-19 для теста)
  # base_url: https://generativelanguage.googleapis.com/v1beta/openai/

  # model: llama-3.3-70b-versatile        # Groq
  # base_url: https://api.groq.com/openai/v1

  # model: gpt-4o-mini                    # модель для GPT
  # base_url: https://api.openai.com/v1   # ChatGPT

# Максимальный размер одного куска (chunk) текста тендера, отправляемого модели за раз.
# Если текст тендера превышает этот лимит — он режется на части по границам документов.
# Ориентировочный пересчёт: 1 токен ≈ 3 символа русского текста.
max_chunk_tokens: 100000

# Поля для извлечения из тендера → колонки в Excel.
#
# Обычное поле:
#   - name: <имя поля в JSON и колонке Excel>
#     description: <описание для модели>
#
# Поле-список (type: list) — массив объектов. Каждый элемент → отдельная строка
# в Excel, общие поля тендера дублируются в каждой строке.
#   item_schema — список подполей одного элемента:
#     key    — имя в JSON-ответе модели
#     column — заголовок колонки Excel
fields:
  - name: позиции
    type: list
    item_schema:
      - {key: название,    column: позиции}
      - {key: количество,  column: количество штук,        numeric: true}
      - {key: цена_за_шт,  column: цена за штуку,          numeric: true}
      - {key: цена_итого,  column: общая цена за позицию,  numeric: true}
    description: |
      массив закупочных позиций тендера. Каждый элемент массива — объект с полями:
        "название"    — наименование товара/работы/услуги (строка)
        "количество"  — количество (число; если не указано — пустая строка)
        "цена_за_шт"  — цена за единицу в рублях (число; если не указано — пустая строка)
        "цена_итого"  — итоговая цена позиции в рублях (число = количество × цена_за_шт; если не указано — пустая строка)
      Если в тендере нет отдельных позиций — вернуть пустой массив [].
      Для тендера на работы/услуги — один элемент массива: название работ, количество 1, цена за единицу = общая цена.
      Пример: [{"название":"Гербера белая","количество":10,"цена_за_шт":50,"цена_итого":500}]

  - name: месяц_торгов
    description: 'месяц проведения торгов или подведения итогов тендера в формате "Месяц Год" (например, "Июнь 2026")'

  - name: месяц_работ
    description: 'месяц начала выполнения работ или поставки в формате "Месяц Год" (например, "Сентябрь 2026"). Если в тендере указана только длительность без даты начала — оставить пустым'

  - name: время_выполнения
    description: 'продолжительность выполнения работ или поставки от старта исполнения контракта (например, "60 календарных дней", "3 месяца", "до 31.12.2026")'

  - name: общая_цена
    description: 'общая цена за весь тендер в рублях — сумма цен всех закупочных позиций. Только число. Часто совпадает с начальной максимальной ценой, но может отличаться'

  - name: категория_заказчика
    description: 'категория заказчика: "государство" если госорганизация (закупка по 44-ФЗ, ФГБУ, ГБУ, министерство, муниципалитет, ГУП, МУП, АО с госучастием) или "частник" если коммерческая организация'

  - name: начальная_цена
    description: 'начальная максимальная цена контракта (НМЦ) в рублях — то что заказчик объявил в извещении. Только число'
