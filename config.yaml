ollama:
  model: gemma3:4b
  base_url: http://localhost:11434
  timeout: 900

api:
  model: deepseek/deepseek-v4-flash:free
  base_url: https://openrouter.ai/api/v1
  # model: gemini-2.0-flash               # Google AI Studio
  # base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  # model: llama-3.3-70b-versatile        # Groq
  # base_url: https://api.groq.com/openai/v1
  # base_url: https://api.openai.com/v1   # ChatGPT
  # model: gpt-4o-mini                    # модель для GPT

max_chunk_tokens: 60000

# Поля для извлечения из тендера → колонки в Excel.
# Чтобы добавить поле: добавить новый элемент name + description.
# Чтобы убрать поле: удалить или закомментировать элемент.
# merge: concat — для полей где нужно объединять значения из всех частей тендера (по умолчанию берётся первое непустое).
fields:
  # 1 — позиции тендера с количеством и ценами
  - name: позиции
    description: 'все закупочные позиции тендера, каждая с новой строки в формате: Название (количество шт., цена_за_шт ₽/шт., цена_итого ₽). Если в тендере нет отдельных позиций — оставить пустым. Если каких-то чисел нет в тексте тендера — пропустить соответствующие части в скобках. Пример: Гербера белая (10 шт., 50₽/шт., 500₽)'
    merge: concat
  # 2 — месяц проведения торгов
  - name: месяц_торгов
    description: 'месяц проведения торгов или подведения итогов тендера в формате "Месяц Год" (например, "Июнь 2026")'
  # 3 — месяц выполнения работ
  - name: месяц_работ
    description: 'месяц начала выполнения работ или поставки в формате "Месяц Год" (например, "Сентябрь 2026"). Если в тендере указана только длительность без даты начала — оставить пустым'
  # 4 — время на выполнение от старта срока исполнения
  - name: время_выполнения
    description: 'продолжительность выполнения работ или поставки от старта исполнения контракта (например, "60 календарных дней", "3 месяца", "до 31.12.2026")'
  # 5 — способ поставки
  - name: способ_поставки
    description: способ или формат поставки/упаковки (тара, контейнер, насыпью, мешки и т.п.). Если не указан — оставить пустым
  # 6 — общая цена за весь тендер (сумма по позициям)
  - name: общая_цена
    description: 'общая цена за весь тендер в рублях — сумма цен всех закупочных позиций. Только число. Часто совпадает с начальной максимальной ценой, но может отличаться'
  # 7 — номер тендера
  - name: номер_тендера
    description: номер извещения или реестровый номер закупки
  # 8 — категория заказчика
  - name: категория_заказчика
    description: 'категория заказчика: "государство" если госорганизация (закупка по 44-ФЗ, ФГБУ, ГБУ, министерство, муниципалитет, ГУП, МУП, АО с госучастием) или "частник" если коммерческая организация'
  # 9 — начальная (максимальная) цена контракта
  - name: начальная_цена
    description: 'начальная максимальная цена контракта (НМЦ) в рублях — то что заказчик объявил в извещении. Только число'
